[project]
name = "kinopub-trakt-sync"
version = "0.1.0"
description = "One-way migration of watch history, playback progress and watchlist from kino.pub to Trakt"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexander Babiy", email = "55639869+asbabiy@users.noreply.github.com" }]
keywords = ["kinopub", "trakt", "watch-history", "sync", "scrobble"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Typing :: Typed",
]
dependencies = [
    "google-genai>=2.17.0",
    "httpx>=0.27",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
]

[project.urls]
Homepage = "https://github.com/asbabiy/kinopub-trakt-sync"
Repository = "https://github.com/asbabiy/kinopub-trakt-sync"
Issues = "https://github.com/asbabiy/kinopub-trakt-sync/issues"

[project.scripts]
kts = "kinopub_trakt_sync.cli:main"

[dependency-groups]
dev = [
    # basedpyright is the gate; ty is the fast local pass (sub-second, but
    # pre-1.0 and it misses constructor argument types, so it does not replace it).
    "basedpyright>=1.39.9",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinopub_trakt_sync"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.basedpyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.13"
executionEnvironments = [{ root = "src" }]
# API payloads are external JSON: they enter as Any at the client boundary and
# are validated into models.py types right after. Unknown-propagation from
# those dicts (and from the partially untyped google-genai SDK) is therefore
# expected and carries no safety signal; every substantive check stays on.
reportAny = false
reportExplicitAny = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 110

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "SIM", "RUF",
    "ANN",   # every signature annotated
    "ASYNC", # async pitfalls (blocking calls in coroutines)
    "DTZ",   # naive datetimes — watched_at must stay UTC-aware
    "C4", "PTH", "RET", "TRY", "ARG", "N", "PL",
]
ignore = [
    "E501",       # formatter owns line breaks
    "RUF001", "RUF002", "RUF003",  # Cyrillic in strings and comments
    "TRY003",     # short inline messages in domain exceptions
    "PLR0913",    # matching functions legitimately take many inputs
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "PLR2004", "ARG"]
# These modules are the external-JSON boundary: payloads from kino.pub, Trakt
# and the on-disk dump are genuinely dynamically typed and stay raw by design —
# they are narrowed into models.py types by transform.py and reconcile.py.
"src/kinopub_trakt_sync/storage.py" = ["ANN401"]
"src/kinopub_trakt_sync/kinopub.py" = ["ANN401"]
"src/kinopub_trakt_sync/trakt.py" = ["ANN401"]
"src/kinopub_trakt_sync/reconcile.py" = ["ANN401"]
