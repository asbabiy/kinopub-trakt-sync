[project]
name = "kinopub-trakt-sync"
version = "0.1.0"
description = "One-way migration of watch history, playback progress and watchlist from kino.pub to Trakt"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.17.0",
    "httpx>=0.27",
]

[project.scripts]
kts = "kinopub_trakt_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinopub_trakt_sync"]
